<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Conferência Fran 15/11</title>
<style>
*{box-sizing:border-box}
:root{--bg:#F7F2EE;--card:#fff;--fg:#2B2226;--muted:#6E5F66;--accent:#E6007E;--line:#EADCE2;--ok:#1E8E4E;--bad:#C62828}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 12px 40px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{background:var(--accent);color:#fff;border-radius:14px;padding:16px}
header h1{margin:0;font-size:1.4rem}
header p{margin:4px 0 0}
.total{font-size:1.25rem;font-weight:800}
.resumo{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700}
.dica{margin:0;color:var(--muted);font-size:.95rem}
.post{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.faixa{background:var(--accent);color:#fff;padding:14px;font-size:1.55rem;font-weight:900;line-height:1.15}
.faixa small{display:block;font-size:1.1rem;font-weight:700;margin-top:4px;color:#fff;opacity:.95}
.foto{position:relative}
.foto img{width:100%;display:block;background:#eee}
.selo{position:absolute;top:10px;left:10px;background:rgba(230,0,126,.94);color:#fff;font-weight:900;font-size:1.35rem;padding:8px 14px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.corpo{padding:14px;display:flex;flex-direction:column;gap:8px}
.corpo h2{margin:0;font-size:1.3rem}
.corpo p{margin:0}
.valor{font-weight:800;color:var(--accent)}
.valor small{display:block;font-weight:600;font-size:.8rem;color:var(--muted)}
.edval{display:none;gap:8px;align-items:center;flex-wrap:wrap}
.edval.on{display:flex}
.edval input{font:inherit;font-size:1.2rem;width:120px;padding:10px;border:2px solid var(--accent);border-radius:10px}
.edval button,.envia button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 16px}
.edb{background:#fff;color:var(--fg);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%;font-weight:700}
.edb small{display:block;font-weight:600;color:var(--muted);white-space:pre-wrap}
.edd{display:none;flex-direction:column;gap:8px}
.edd.on{display:flex}
.edd textarea{font:inherit;font-size:16px;min-height:80px;padding:10px;border:2px solid var(--accent);border-radius:10px;width:100%}
.edd button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 16px}
.forn{margin:10px 0 -6px;background:var(--fg);color:#fff;border-radius:14px;padding:14px 16px}
.forn h2{margin:0;font-size:1.3rem}
.forn p{margin:2px 0 0;font-weight:700}
.envia{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.envia p{margin:0;color:var(--muted);font-size:.95rem}
.envia .wa{background:#1E8E4E}
.prov{font-size:.8rem;color:var(--muted)}
button{font:inherit;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}
.conf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.conf button.cat{padding:8px;font-size:.8rem;line-height:1.1;min-width:64px}
.conf button.cat.on{background:#7B2CBF;border-color:#7B2CBF;color:#fff}
.conf button{background:#fff;color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:14px 6px}
.conf button.sim.on{background:var(--ok);border-color:var(--ok);color:#fff}
.conf button.nao.on{background:var(--bad);border-color:var(--bad);color:#fff}
.falta{display:none;gap:10px;align-items:center;flex-wrap:wrap}
.falta.on{display:flex}
.falta input{font:inherit;font-size:1.2rem;width:100px;padding:10px;border:2px solid var(--bad);border-radius:10px}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:#eee}
.car::-webkit-scrollbar{display:none}
.car>*{flex:0 0 100%;width:100%;scroll-snap-align:center;display:block;object-fit:contain;background:#eee;max-height:80vh}
.cnt{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-weight:800;font-size:.9rem;padding:4px 10px;border-radius:20px;pointer-events:none}
.rola{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:.85rem;font-weight:700;padding:4px 12px;border-radius:20px;pointer-events:none}
</style></head><body>
<div class="wrap">
<header>
<h1>Fornecedor: Fran Novo Brass</h1>
<p class="total">15/11 · 194 peças</p>
</header>
<div id="lista" style="display:flex;flex-direction:column;gap:22px"></div>
<div class="envia">
<button type="button" class="wa" id="envWa">📤 Enviar lista pelo WhatsApp</button><button type="button" id="envCp">Copiar lista</button></div>
</div>
<script>
var PECAS=[
 {nome:"Short alfaiataria com cinto",qtd:12,det:"",tam:"G e GG",cores:"preto",valor:"49,90"},
 {nome:"Short alfaiataria com cinto",qtd:12,det:"6 G + 6 GG",tam:"G e GG",cores:"preto, marrom e caramelo (as 3 cores da foto)",valor:"49,90"},
 {nome:"Conjunto Plus Size",qtd:12,det:"4 G1 + 4 G2 + 4 G3",tam:"G1, G2 e G3",cores:"estampa preta e estampa marrom",valor:"69,90"},
 {nome:"Macaquinho Plus Size",qtd:12,det:"6 G1 + 6 G2",tam:"G1 e G2",cores:"vinho e preto",valor:"79,90"},
 {nome:"Regata de suplex",qtd:24,det:"",tam:"Tamanho único (veste M e G)",cores:"preto, marinho e marrom café",valor:"29,90"},
 {nome:"Macaquinho",qtd:12,det:"",tam:"Tamanho único (veste até o 42)",cores:"vermelho, off-white e amarelo",valor:"69,90"},
 {nome:"Short Plus Alfaiataria",qtd:12,det:"6 G1 + 6 G2",tam:"G1 e G2",cores:"preto e vinho",valor:"49,90"},
 {nome:"Blusas plus",qtd:98,det:"9 modelos, total de todos juntos",tam:"Tamanho único (veste GG)",cores:"modelos e cores das fotos",valor:"39,90",fotos:["img/fran-15-11-8-1.jpg","img/fran-15-11-8-2.jpg","img/fran-15-11-8-3.jpg","img/fran-15-11-8-4.jpg","img/fran-15-11-8-5.jpg","img/fran-15-11-8-6.jpg","img/fran-15-11-8-7.jpg","img/fran-15-11-8-8.jpg","img/fran-15-11-8-9.jpg"]}
];
var TOTAL=PECAS.reduce(function(t,p){return t+p.qtd},0);
function fmt(n){return n.toFixed(2).replace('.',',')}
function num(v){var n=parseFloat(String(v||'').replace(/\s|\$|R/g,'').replace(/\./g,'').replace(',','.'));return isNaN(n)?null:n}
function valorDe(p,i){return num(p.valor)}
function textoValor(n){return n==null?'Valor: aguardando a Gabi':'Valor $'+fmt(n)+' ou 💵 $'+fmt(Math.round(n*95)/100)+' à vista (5% desc.)'}
function ler(k){try{return localStorage.getItem(k)}catch(e){return null}}
function temOk(s){return !!s&&s.indexOf('ok')>=0}
function temF(s){return !!s&&s.indexOf('falta')>=0}
function marca(k,o,f){gravar(k,o&&f?'ok+falta':o?'ok':f?'falta':null)}
function gravar(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function resumo(){var ok=0,f=0,cheg=0;PECAS.forEach(function(p,i){var s=ler('conf-fran-15-11-'+i);if(temOk(s))ok++;if(!temF(s)&&temOk(s))cheg+=p.qtd;if(temF(s)){f++;cheg+=Math.max(0,p.qtd-(parseInt(ler('conf-fran-15-11-'+i+'-n')||'0',10)||0))}});
 var R=document.getElementById('resumo');if(R)R.textContent='✅ '+ok+' no catálogo · ❌ '+f+' faltou · '+cheg+' de '+TOTAL+' peças chegaram'}
function midia(p,def){var f=p.fotos||[def];if(f.length<2)return '<img src="'+f[0]+'" alt="">';
 return '<div class="car">'+f.map(function(u){return /\.mp4$/.test(u)?'<video src="'+u+'" poster="'+u.replace('vid/','img/').replace('.mp4','.jpg')+'" muted playsinline loop controls preload="none"></video>':'<img src="'+u+'" alt="" loading="lazy">'}).join('')+'</div><span class="cnt">1/'+f.length+'</span><span class="rola">⇠ arraste pro lado ⇢</span>'}
function carro(a){var c=a.querySelector('.car'),cn=a.querySelector('.cnt');if(c&&cn)c.addEventListener('scroll',function(){cn.textContent=(Math.round(c.scrollLeft/c.clientWidth)+1)+'/'+c.children.length;var r=a.querySelector('.rola');if(r)r.style.display='none'},{passive:true})}
var L=document.getElementById('lista');
PECAS.forEach(function(p,i){
 var k='conf-fran-15-11-'+i;
 var a=document.createElement('article');a.className='post';
 a.innerHTML='<div class="faixa">'+(i+1)+') VEM '+p.qtd+' PEÇAS – '+(p.tam||'tamanho único')+(p.det?'<small>'+p.det+'</small>':'')+'</div>'+
 '<div class="foto">'+midia(p,'img/fran-15-11-'+(i+1)+'.jpg?v=4')+'</div>'+
 '<div class="corpo"><h2></h2><p><b>Tamanhos:</b> '+(p.tam||'tamanho único')+'</p><p><b>🎨 Cores:</b> '+p.cores+'</p>'+
 '<p class="valor"></p>'+
 '<button type="button" class="edb">✏️ Edição detalhes<small></small></button>'+
 '<div class="edd"><textarea placeholder="Ex.: o nome é Blusa Plus GG, veio só GG, veio azul em vez de preto"></textarea><button type="button" class="salvad">Salvar</button></div>'+
 ''+
 '<div class="conf"><button type="button" class="sim">✅ OK · Catálogo</button><button type="button" class="nao">❌ Faltou</button></div>'+
 '<div class="falta"><span>Quantas faltaram?</span><input type="number" inputmode="numeric" min="0" placeholder="0"></div></div>';
 a.querySelector('h2').textContent=p.nome;
 var sim=a.querySelector('.sim'),nao=a.querySelector('.nao'),f=a.querySelector('.falta'),inp=f.querySelector('input');
 function pintar(){var s=ler(k);sim.classList.toggle('on',temOk(s));nao.classList.toggle('on',temF(s));f.classList.toggle('on',temF(s));inp.value=ler(k+'-n')||'';resumo()}
 sim.onclick=function(){var s=ler(k);marca(k,!temOk(s),temF(s));pintar()};
 nao.onclick=function(){var s=ler(k);marca(k,temOk(s),!temF(s));pintar();if(temF(ler(k)))inp.focus()};
 inp.oninput=function(){gravar(k+'-n',inp.value);resumo()};
 a.querySelector('.valor').textContent=textoValor(num(p.valor));
var eb=a.querySelector('.edb'),ed2=a.querySelector('.edd'),ta=ed2.querySelector('textarea'),dk='det-fran-15-11-'+i;
 function pd(){var t=ler(dk)||'';eb.querySelector('small').textContent=t?t:'toque pra escrever o que mudar (nome, tamanho, cor...)'}
 eb.onclick=function(){ed2.classList.toggle('on');ta.value=ler(dk)||'';if(ed2.classList.contains('on'))ta.focus()};
 ed2.querySelector('.salvad').onclick=function(){var t=ta.value.trim();gravar(dk,t||null);ed2.classList.remove('on');pd()};
 pd();pintar();L.appendChild(a);carro(a);
});
function listaValores(){var t='Fran Novo Brass 15/11',c=[],fl=[],al=[];PECAS.forEach(function(p,i){var n=valorDe(p,i);var k2='conf-fran-15-11-'+i,st=ler(k2),dt=ler('det-fran-15-11-'+i);if(dt)al.push((i+1)+') '+p.nome+': '+dt);if(temF(st))fl.push((i+1)+') '+p.nome+': faltaram '+(parseInt(ler('conf-fran-15-11-'+i+'-n')||'0',10)||0)+' de '+p.qtd);if(temOk(st))c.push((i+1)+') '+p.nome+' ('+(p.tam||'tamanho único')+')'+(temF(st)?' – chegaram '+Math.max(0,p.qtd-(parseInt(ler(k2+'-n')||'0',10)||0))+' de '+p.qtd:'')+(n==null?'':' $'+fmt(n)))});
 t+='\n\n✅ OK, colocar no catálogo:'+(c.length?'\n'+c.join('\n'):' nenhuma');t+='\n\n❌ Faltou:'+(fl.length?'\n'+fl.join('\n'):' nada');if(al.length)t+='\n\n✏️ Alterações:\n'+al.join('\n');return t}
document.getElementById('envWa').onclick=function(){location.href='https://wa.me/?text='+encodeURIComponent(listaValores())};
document.getElementById('envCp').onclick=function(){var b=this,t=listaValores();function ok(){b.textContent='Copiado ✓';setTimeout(function(){b.textContent='Copiar lista'},2000)}
 try{navigator.clipboard.writeText(t).then(ok,function(){fb()})}catch(e){fb()}
 function fb(){var x=document.createElement('textarea');x.value=t;x.setAttribute('readonly','');x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();x.setSelectionRange(0,99999);try{document.execCommand('copy');ok()}catch(e){}document.body.removeChild(x)}};
</script>
</body></html>
