.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{background:var(--accent);color:#fff;border-radius:14px;padding:16px}

header p{margin:4px 0 0}

.post{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.faixa{background:var(--accent);color:#fff;padding:14px;font-size:1.55rem;font-weight:900;line-height:1.15}
.faixa small{display:block;font-size:1.1rem;font-weight:700;margin-top:4px;color:#fff;opacity:.95}
.foto{position:relative}
.foto img{width:100%;display:block;background:#eee}
.selo{position:absolute;top:10px;left:10px;background:rgba(230,0,126,.94);color:#fff;font-weight:900;font-size:1.35rem;padding:8px 14px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.corpo{padding:14px;display:flex;flex-direction:column;gap:8px}
.corpo h2{margin:0;font-size:1.3rem}
.corpo p{margin:0}
.valor{font-weight:800;color:var(--accent)}
.valor small{display:block;font-weight:600;font-size:.8rem;color:var(--muted)}
.edval{display:none;gap:8px;align-items:center;flex-wrap:wrap}
.edval.on{display:flex}
.edval input{font:inherit;font-size:1.2rem;width:120px;padding:10px;border:2px solid var(--accent);border-radius:10px}
.edval button,.envia button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 16px}
.edb{background:#fff;color:var(--fg);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%;font-weight:700}
.edb small{display:block;font-weight:600;color:var(--muted);white-space:pre-wrap}
.edd{display:none;flex-direction:column;gap:8px}
.edd.on{display:flex}
.edd textarea{font:inherit;font-size:16px;min-height:80px;padding:10px;border:2px solid var(--accent);border-radius:10px;width:100%}
.edd button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 16px}
.forn{margin:0 0 -6px;}
.forn~.forn,.post+.forn{margin-top:26px}
.forn{background:var(--fg);color:#fff;border-radius:14px;padding:18px 16px;border-left:10px solid var(--accent)}
.forn h2{margin:0;font-size:1.5rem;line-height:1.2}
.forn p{margin:2px 0 0;font-weight:700}
.envia{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.envia p{margin:0;color:var(--muted);font-size:.95rem}
.envia .wa{background:#1E8E4E}
.prov{font-size:.8rem;color:var(--muted)}
button{font:inherit;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}
.conf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.conf button.cat{padding:8px;font-size:.8rem;line-height:1.1;min-width:64px}
.conf button.cat.on{background:#7B2CBF;border-color:#7B2CBF;color:#fff}
.conf button{background:#fff;color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:14px 6px}
.conf button.sim.on{background:var(--ok);border-color:var(--ok);color:#fff}
.conf button.nao.on{background:var(--bad);border-color:var(--bad);color:#fff}
.falta{display:none;gap:10px;align-items:center;flex-wrap:wrap}
.falta.on{display:flex}
.falta input{font:inherit;font-size:1.2rem;width:100px;padding:10px;border:2px solid var(--bad);border-radius:10px}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:#eee}
.car::-webkit-scrollbar{display:none}
.car>*{flex:0 0 100%;width:100%;scroll-snap-align:center;display:block;object-fit:contain;background:#eee;max-height:80vh}
.cnt{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-weight:800;font-size:.9rem;padding:4px 10px;border-radius:20px;pointer-events:none}
.rola{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:.85rem;font-weight:700;padding:4px 12px;border-radius:20px;pointer-events:none}
.forn .nota{background:#fff;color:var(--fg);border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:400;font-size:.95rem}.forn .nota p{margin:2px 0 6px;color:var(--muted)}.forn .nota ul{margin:0;padding:0;list-style:none;columns:2;column-gap:14px}.forn .nota li{padding:2px 0;break-inside:avoid}.forn .nota li b{display:inline-block;min-width:26px;color:var(--accent)}
